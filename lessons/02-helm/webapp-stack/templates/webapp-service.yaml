apiVersion: v1
kind: Service
metadata:
  name: webapp-service
  labels:
    {{- include "webapp-stack.labels" . | nindent 4 }}
spec:
  type: {{ .Values.webapp.service.type }}
  selector:
    app: webapp
  ports:
    - protocol: TCP
      port: {{ .Values.webapp.service.port }}
      targetPort: {{ .Values.webapp.containerPort }}
      # nodePort is only a valid field for type: NodePort - a ClusterIP service
      # (what lesson 3/Ingress will switch this to) would fail to render with it
      # present, so it's wrapped in this condition instead of always included.
      {{- if eq .Values.webapp.service.type "NodePort" }}
      nodePort: {{ .Values.webapp.service.nodePort }}
      {{- end }}
