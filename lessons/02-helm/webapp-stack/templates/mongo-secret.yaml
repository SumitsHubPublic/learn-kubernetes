apiVersion: v1
kind: Secret
metadata:
  name: mongo-secret
  labels:
    {{- include "webapp-stack.labels" . | nindent 4 }}
type: Opaque
data:
  # Kubernetes Secret `data` values must be base64. The raw values live in
  # values.yaml; `| b64enc` does the encoding at render time so you never have
  # to hand-run `echo -n ... | base64` yourself. Still base64, not encryption -
  # see values.yaml note and docs/00-baseline-review.md finding #1.
  mongo-root-username: {{ .Values.mongo.auth.username | b64enc }}
  mongo-root-password: {{ .Values.mongo.auth.password | b64enc }}
