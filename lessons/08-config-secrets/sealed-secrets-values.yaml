# Helm values for the Sealed Secrets controller
# Install with:
#   helm repo add sealed-secrets https://bitnami-labs.github.io/sealed-secrets
#   helm install sealed-secrets sealed-secrets/sealed-secrets \
#     -n kube-system -f lessons/08-config-secrets/sealed-secrets-values.yaml

# Keep the controller lightweight for a dev cluster
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi
