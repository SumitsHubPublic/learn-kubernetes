# Helm values for the Sealed Secrets controller
# Install with one of the two methods below:
#
# METHOD 1 (Helm) — recommended for most environments:
#   helm repo add bitnami https://charts.bitnami.com/bitnami
#   helm repo update
#   helm install sealed-secrets bitnami/sealed-secrets \
#     -n kube-system -f lessons/08-config-secrets/sealed-secrets-values.yaml
#
# METHOD 2 (Raw manifests) — use if Helm fails (e.g., WSL2 credential issues):
#   kubectl apply -f https://github.com/bitnami-labs/sealed-secrets/releases/download/v0.27.0/controller.yaml

# Keep the controller lightweight for a dev cluster
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi
