apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mongo-network-policy
  namespace: default
spec:
  podSelector:
    matchLabels:
      app: mongo
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Only allow traffic from the webapp pod on port 27017
  - from:
    - podSelector:
        matchLabels:
          app: webapp
    ports:
    - protocol: TCP
      port: 27017
  egress:
  # Allow DNS resolution (required for any egress to work)
  - ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
