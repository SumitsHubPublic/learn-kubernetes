apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp-deployment
  labels:
    app: webapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: webapp
  template:
    metadata:
      labels:
        app: webapp
    spec:
      containers:
      - name: webapp
        image: nanajanashia/k8s-demo-app:v1.0
        ports:
        - containerPort: 3000
        env:
        - name: USER_NAME
          valueFrom:
            secretKeyRef:
              name: mongo-secret
              key: mongo-root-username
        - name: USER_PWD
          valueFrom:
            secretKeyRef:
              name: mongo-secret
              key: mongo-root-password
        - name: DB_URL
          valueFrom:
            configMapKeyRef:
              name: mongo-config
              key: mongo-url
        # Readiness: stop sending traffic if the app isn't serving yet
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 5   # wait 5s after container start before first check
          periodSeconds: 5         # re-check every 5s
          failureThreshold: 3      # mark NotReady after 3 consecutive failures
          timeoutSeconds: 3        # each HTTP call must respond within 3s
        # Liveness: restart the container if it gets stuck (not just slow)
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 10  # give the app more time before liveness kicks in
          periodSeconds: 10
          failureThreshold: 3
          timeoutSeconds: 3
