apiVersion: v1
kind: Pod
metadata:
  name: load-generator
  labels:
    app: load-generator
spec:
  containers:
  - name: load-generator
    image: busybox:1.36
    command:
    - /bin/sh
    - -c
    - |
      for i in $(seq 1 20); do
        (while true; do wget -q -O- http://webapp-service:3000/ > /dev/null; done) &
      done
      wait
  restartPolicy: Never
