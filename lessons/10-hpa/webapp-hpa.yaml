apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: webapp-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: webapp-deployment
  minReplicas: 2
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 50   # % of the CPU *request* (50m), not the limit
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0    # react immediately to a spike
      policies:
      - type: Percent
        value: 100
        periodSeconds: 15             # allow doubling replicas every 15s
      - type: Pods
        value: 2
        periodSeconds: 15
      selectPolicy: Max               # pick whichever policy scales up faster
    scaleDown:
      stabilizationWindowSeconds: 60  # wait 60s of low usage before scaling down
      policies:
      - type: Pods
        value: 1
        periodSeconds: 60             # remove at most 1 pod per 60s
